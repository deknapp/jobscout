apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app.kubernetes.io/name: jobscout
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8765
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  # One. The state volume is ReadWriteOnce and this pod writes to it; a second
  # replica would either fail to schedule or race the first through the same
  # unlocked JSON files.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a rollout that briefly ran two pods would
    # hit the same single-writer problem, and the surge pod cannot mount the
    # volume anyway.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jobscout
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobscout
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: jobscout:dev
          imagePullPolicy: IfNotPresent
          args: ["serve", "--no-browser"]
          envFrom:
            - configMapRef: { name: jobscout-config }
            - secretRef:    { name: jobscout-secrets }
          ports:
            - name: http
              containerPort: 8765
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: state, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: jobscout-state
        - name: tmp
          emptyDir: {}
