apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jobscout

resources:
  - ../../base
  - nodeport.yaml

images:
  - name: jobscout
    newTag: dev

# imagePullPolicy is IfNotPresent in the base: `kind load` puts the image on
# the node, so there is nothing to pull and a pull would fail.
