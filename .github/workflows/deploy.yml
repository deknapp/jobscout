# Stands up a real cluster on every push, deploys jobscout to it, queues a
# discovery run and asserts that the pool scaled and did the work.
#
# The point is that a green badge here means this deploys and runs, not that
# the YAML parsed. Three things have broken in ways that only a real cluster
# shows: a Service unreachable from outside because a NetworkPolicy selector
# cannot match a source that is not a pod, a KEDA scaler that never lifts a
# pool off zero, and a web server bound to 127.0.0.1 inside a pod.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: manifests render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize builds
        run: kubectl kustomize deploy/overlays/kind > /tmp/rendered.yaml
      - name: no api key may be committed
        # The base Secret carries an empty key on purpose; `make secret` fills
        # it from the environment. A real one rendering here would be a real
        # one in a public repository.
        run: |
          if grep -qE 'ANTHROPIC_API_KEY: *"?sk-' /tmp/rendered.yaml; then
            echo "an API key is present in the rendered manifests"; exit 1
          fi
      - name: the workers must not mount the state volume
        # The whole design rests on this. A worker with the state volume would
        # be a second writer to unlocked JSON files, and RWO would stop it
        # scheduling anywhere but the one node.
        run: |
          python3 - <<'PY'
          import re, sys
          docs = open("/tmp/rendered.yaml").read().split("\n---\n")
          for doc in docs:
              if re.search(r"^\s+app\.kubernetes\.io/component: worker$", doc, re.M) \
                 and "jobscout-state" in doc:
                  sys.exit("a worker manifest mounts the state volume")
          print("workers hold no state volume")
          PY

  cluster:
    name: deploy to a real cluster
    runs-on: ubuntu-latest
    needs: [manifests]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: build the image
        run: docker build -t jobscout:dev .

      - name: the image must be able to run
        run: |
          docker run --rm jobscout:dev --version
          docker run --rm jobscout:dev worker --help > /dev/null

      - uses: helm/kind-action@v1
        with:
          cluster_name: jobscout
          config: deploy/kind/cluster.yaml
          wait: 120s

      - run: kind load docker-image jobscout:dev --name jobscout

      - name: install KEDA
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo update kedacore
          helm upgrade --install keda kedacore/keda \
            --namespace keda --create-namespace --version 2.17.2 --wait --timeout 6m

      - name: deploy
        run: |
          kubectl apply -k deploy/overlays/kind
          kubectl -n jobscout rollout status statefulset/redis --timeout=180s
          kubectl -n jobscout rollout status deployment/web --timeout=240s

      - name: KEDA must have accepted the ScaledObject
        # A ScaledObject that never reconciles leaves everything else looking
        # healthy while the pool stays at zero and the queue fills up.
        run: kubectl -n jobscout wait scaledobject/worker --for=condition=Ready --timeout=120s

      - name: the web app must be reachable from outside the cluster
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8765/ || true)
            [ "$code" = "200" ] && { echo "web app returned 200"; exit 0; }
            sleep 4
          done
          echo "web app never answered"; exit 1

      - name: a queued run must scale the pool and get the work done
        run: scripts/ci-discovery-check.sh

      - name: what the cluster was doing, if that failed
        if: failure()
        run: |
          kubectl -n jobscout get pods -o wide
          kubectl -n jobscout get scaledobject,hpa,cronjobs
          kubectl -n jobscout describe pods | tail -100
          kubectl -n jobscout logs -l app.kubernetes.io/component=worker --tail=60 || true
          kubectl -n jobscout logs -l app.kubernetes.io/component=web --tail=40 || true
          kubectl -n keda logs deploy/keda-operator --tail=60 || true
